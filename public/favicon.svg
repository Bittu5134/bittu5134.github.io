<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Neo-Brutalist 3.5" Floppy Disk Favicon / Brand Logo for BITTU.DEV -->
  <!-- Black brutal offset shadow -->
  <path d="M 10 9 L 52 9 L 59 16 L 59 59 L 10 59 Z" fill="#000000" />

  <!-- Disk Plastic Body (Yellow #fde047) with clipped top-right corner -->
  <path d="M 6 5 L 48 5 L 55 12 L 55 55 L 6 55 Z" 
        fill="#fde047" 
        stroke="#000000" 
        stroke-width="3" 
        stroke-linejoin="miter" />

  <!-- Top Metal Shutter Slider (#fffdf9) -->
  <rect x="14" y="5" width="27" height="19" fill="#fffdf9" stroke="#000000" stroke-width="2.5" />
  
  <!-- Shutter Cutout (dark slot inside) -->
  <rect x="22" y="9" width="7" height="11" fill="#14161f" stroke="#000000" stroke-width="1.5" />

  <!-- Metal Shutter Grip Lines -->
  <line x1="34" y1="9" x2="34" y2="19" stroke="#000000" stroke-width="1.5" />

  <!-- Central Paper Label Area (#fffdf9) -->
  <rect x="12" y="28" width="37" height="27" fill="#fffdf9" stroke="#000000" stroke-width="2.5" />

  <!-- Label Color Header Strip (#fb923c) -->
  <rect x="12" y="28" width="37" height="7" fill="#fb923c" stroke="#000000" stroke-width="2" />

  <!-- Pixelated 'B' Monogram on the label -->
  <!-- Vertical Stem -->
  <rect x="16" y="38" width="3" height="13" fill="#000000" />
  <!-- Top horizontal bar -->
  <rect x="19" y="38" width="6" height="2.5" fill="#000000" />
  <!-- Middle horizontal bar -->
  <rect x="19" y="43" width="5" height="2.5" fill="#000000" />
  <!-- Bottom horizontal bar -->
  <rect x="19" y="48.5" width="6" height="2.5" fill="#000000" />
  <!-- Upper loop right vertical -->
  <rect x="24" y="39.5" width="2.5" height="4.5" fill="#000000" />
  <!-- Lower loop right vertical -->
  <rect x="24" y="44.5" width="2.5" height="5" fill="#000000" />

  <!-- Terminal prompt '>_' next to 'B' -->
  <!-- '>' prompt arrow -->
  <rect x="30" y="39" width="2" height="2" fill="#2563eb" />
  <rect x="32" y="41" width="2" height="2" fill="#2563eb" />
  <rect x="30" y="43" width="2" height="2" fill="#2563eb" />
  
  <!-- Blinking Cursor block -->
  <rect x="36" y="43" width="7" height="2.5" fill="#000000" />
  
  <!-- Subtle label lines -->
  <rect x="30" y="48" width="15" height="1.5" fill="#9ca3af" />

  <!-- Bottom Notches -->
  <!-- Write-protect notch (left) -->
  <rect x="8" y="50" width="3" height="5" fill="#000000" />
  <!-- High Density notch (right) -->
  <rect x="50" y="50" width="3" height="5" fill="#000000" />
</svg>
