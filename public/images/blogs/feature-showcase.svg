<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dot-grid-sc" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d3c6ab" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f6eedb"/>
  <rect width="1200" height="630" fill="url(#dot-grid-sc)"/>

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- Top Header Bar -->
