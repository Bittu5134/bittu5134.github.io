    <rect x="30" y="398" width="340" height="28" fill="#000000" stroke="#86efac" stroke-width="1"/>
    <text x="45" y="417" font-family="'Space Mono', monospace" font-size="12" fill="#86efac">&gt; PIPELINE_TEST: ALL PASSED [100%]</text>
