  <circle cx="64" cy="56" r="10" fill="#f87171" stroke="#000000" stroke-width="3"/>
  <circle cx="94" cy="56" r="10" fill="#fb923c" stroke="#000000" stroke-width="3"/>
  <circle cx="124" cy="56" r="10" fill="#86efac" stroke="#000000" stroke-width="3"/>
  <text x="160" y="62" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#000000">SPEC_TEST // MARKDOWN_ENGINE_TEST_HARNESS.SYS</text>
  <rect x="990" y="40" width="160" height="32" fill="#000000"/>
