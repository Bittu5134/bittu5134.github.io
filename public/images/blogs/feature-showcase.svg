      <text x="15" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#fb923c">[✓] GH ALERTS</text>
      <text x="15" y="140" font-family="'Space Mono', monospace" font-size="11" fill="#8b949e">5 Callout Types</text>

      <rect x="180" y="90" width="160" height="70" fill="#1f293d" stroke="#c4b5fd" stroke-width="2"/>
      <text x="195" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#c4b5fd">[✓] TOC SPY</text>
      <text x="195" y="140" font-family="'Space Mono', monospace" font-size="11" fill="#8b949e">Scroll Observer</text>

      <!-- Row 3 -->
      <rect x="0" y="180" width="160" height="70" fill="#1f293d" stroke="#fde047" stroke-width="2"/>
      <text x="15" y="208" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#fde047">[✓] PROGRESS</text>
      <text x="15" y="230" font-family="'Space Mono', monospace" font-size="11" fill="#8b949e">Top Viewport Bar</text>

      <rect x="180" y="180" width="160" height="70" fill="#1f293d" stroke="#f87171" stroke-width="2"/>
      <text x="195" y="208" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#f87171">[✓] OG IMAGE</text>
      <text x="195" y="230" font-family="'Space Mono', monospace" font-size="11" fill="#8b949e">1200x630 Social</text>
