    <rect x="36" y="36" width="130" height="32" fill="#86efac" stroke="#000000" stroke-width="3"/>
    <text x="50" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">SHIKI SSG</text>

    <rect x="180" y="36" width="140" height="32" fill="#38bdf8" stroke="#000000" stroke-width="3"/>
    <text x="194" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">MERMAID.JS</text>

    <rect x="334" y="36" width="140" height="32" fill="#fb923c" stroke="#000000" stroke-width="3"/>
    <text x="350" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">GH ALERTS</text>

    <!-- Title -->
    <text x="36" y="126" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="900" fill="#000000">
      <tspan x="36" dy="0">Engineering Handbook</tspan>
      <tspan x="36" dy="50">&amp; Feature Showcase</tspan>
    </text>

    <text x="36" y="270" font-family="'Space Mono', monospace" font-size="18" fill="#444444">
      <tspan x="36" dy="0">Complete stress-test for build-time syntax</tspan>
      <tspan x="36" dy="28">highlighting, on-demand Mermaid diagrams,</tspan>
      <tspan x="36" dy="28">dynamic TOC, and reactive collections.</tspan>
    </text>

    <!-- Author Pill -->
