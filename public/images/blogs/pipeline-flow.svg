<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <pattern id="diag-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e5e7eb" />
    </pattern>
    <filter id="soft-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Background Canvas matching article surface -->
  <rect width="1000" height="480" rx="12" fill="#fffdf9" stroke="#e5e7eb" stroke-width="2"/>
  <rect width="1000" height="480" rx="12" fill="url(#diag-grid)"/>

  <!-- Top Title Bar -->
  <rect x="2" y="2" width="996" height="44" rx="10" fill="#fafaf9" />
  <line x1="2" y1="46" x2="998" y2="46" stroke="#e5e7eb" stroke-width="1.5" />
  <circle cx="28" cy="24" r="5" fill="#f87171" />
  <circle cx="44" cy="24" r="5" fill="#fde047" />
  <circle cx="60" cy="24" r="5" fill="#86efac" />
  <text x="84" y="29" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#4b5563">UNIFIED COMPILATION PIPELINE // DATA FLOW ARCHITECTURE</text>

  <!-- Node 1: Raw Markdown Source -->
  <g filter="url(#soft-shadow)">
    <rect x="60" y="110" width="220" height="110" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect x="60" y="110" width="220" height="28" rx="7" fill="#fef3c7" />
    <text x="80" y="129" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#92400e">01 // SOURCE INPUT</text>
    <text x="80" y="165" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#111827">Markdown (.md)</text>
    <text x="80" y="190" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#6b7280">+ YAML Frontmatter</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 280 165 L 380 165" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <polygon points="380,165 370,160 370,170" fill="#d97706" />

  <!-- Node 2: Remark AST Transformations -->
  <g filter="url(#soft-shadow)">
    <rect x="390" y="85" width="240" height="160" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect x="390" y="85" width="240" height="28" rx="7" fill="#dbeafe" />
    <text x="410" y="104" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#1e40af">02 // MDAST PASS</text>
    <text x="410" y="140" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#111827">Remark Ecosystem</text>
    <text x="410" y="166" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#4b5563">• remark-gfm (Tables, Tasks)</text>
    <text x="410" y="188" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#4b5563">• remark-math (LaTeX parser)</text>
    <text x="410" y="210" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#4b5563">• code titles &amp; alerts</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 630 165 L 720 165" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="720,165 710,160 710,170" fill="#2563eb" />

  <!-- Node 3: Rehype HTML AST Transformations -->
  <g filter="url(#soft-shadow)">
    <rect x="730" y="85" width="220" height="160" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <rect x="730" y="85" width="220" height="28" rx="7" fill="#dcfce7" />
    <text x="750" y="104" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#15803d">03 // HAST ENRICHMENT</text>
    <text x="750" y="140" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#111827">Rehype Processors</text>
    <text x="750" y="166" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#4b5563">• @shikijs/rehype (0KB JS)</text>
    <text x="750" y="188" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#4b5563">• rehype-katex (SSG Math)</text>
    <text x="750" y="210" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#4b5563">• figure, slug &amp; anchors</text>
  </g>

  <!-- Downward connector to Final Static Output -->
  <path d="M 840 245 L 840 320 L 510 320 L 510 350" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="510,350 505,340 515,340" fill="#6b7280" />

  <!-- Node 4: Final Output Box -->
  <g filter="url(#soft-shadow)">
    <rect x="330" y="355" width="360" height="85" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <text x="510" y="388" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#fde047" text-anchor="middle">Static Pre-compiled HTML</text>
    <text x="510" y="415" font-family="'Space Mono', monospace" font-size="12" fill="#9ca3af" text-anchor="middle">Zero Client-Side Markdown Overhead</text>
  </g>
</svg>
