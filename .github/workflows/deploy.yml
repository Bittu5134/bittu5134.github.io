name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Daily rebuild at 04:30 UTC (~10:00 IST) — keeps the build-time
    # contribution chart (ghchart) and any regenerated data fresh.
    - cron: "30 4 * * *"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools (provides pyftsubset)
        run: python -m pip install "fonttools[woff]"

      - name: Install dependencies
        run: npm ci

      # The project cards read stars, forks, descriptions and the pinned set from
      # the GitHub API. Unauthenticated calls from shared runner IPs run out of
      # the 60/hour budget and come back as 403, which silently drops every
      # description and badge from the page. Using the workflow token raises that
      # to 5000/hour, and the cached fetch means a bad run reuses the last good
      # response instead of blanking the section.
      - name: Cache GitHub build data
        uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-fetch-${{ hashFiles('src/_data/projects.js') }}-${{ github.run_id }}
          restore-keys: |
            eleventy-fetch-${{ hashFiles('src/_data/projects.js') }}-
            eleventy-fetch-

      - name: Build site with metadata & Vite
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
