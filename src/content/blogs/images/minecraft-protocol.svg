<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dot-grid-mc" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d3c6ab" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f6eedb"/>
  <rect width="1200" height="630" fill="url(#dot-grid-mc)"/>

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- Top Header Bar -->
  <rect x="24" y="24" width="1152" height="64" fill="#86efac" stroke="#000000" stroke-width="6"/>
  <circle cx="64" cy="56" r="10" fill="#f87171" stroke="#000000" stroke-width="3"/>
  <circle cx="94" cy="56" r="10" fill="#fde047" stroke="#000000" stroke-width="3"/>
  <circle cx="124" cy="56" r="10" fill="#38bdf8" stroke="#000000" stroke-width="3"/>
  <text x="160" y="62" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#000000">REVERSE_ENG // MINECRAFT_WIRE_PROTOCOL.BIN</text>
  <rect x="990" y="40" width="160" height="32" fill="#000000"/>
  <text x="1016" y="62" font-family="'Space Mono', monospace" font-size="16" font-weight="bold" fill="#86efac">PROTOCOLS</text>

  <!-- Main Content Card -->
  <g transform="translate(64, 120)">
    <rect x="8" y="8" width="620" height="440" fill="#000000"/>
    <rect x="0" y="0" width="620" height="440" fill="#fffdf9" stroke="#000000" stroke-width="5"/>
    
    <!-- Badges -->
    <rect x="36" y="36" width="110" height="32" fill="#fde047" stroke="#000000" stroke-width="3"/>
    <text x="52" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">VARINT</text>

    <rect x="160" y="36" width="140" height="32" fill="#fb923c" stroke="#000000" stroke-width="3"/>
    <text x="176" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">ZLIB_STREAM</text>

    <rect x="314" y="36" width="130" height="32" fill="#c4b5fd" stroke="#000000" stroke-width="3"/>
    <text x="330" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">C++ / TCP</text>

    <!-- Title -->
    <text x="36" y="126" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="900" fill="#000000">
      <tspan x="36" dy="0">Reverse Engineering</tspan>
      <tspan x="36" dy="52">Minecraft Protocol</tspan>
    </text>

    <text x="36" y="270" font-family="'Space Mono', monospace" font-size="18" fill="#444444">
      <tspan x="36" dy="0">Dissecting the Java binary wire format:</tspan>
      <tspan x="36" dy="28">VarInt compression, state transitions,</tspan>
      <tspan x="36" dy="28">and low-overhead packet sniffing.</tspan>
    </text>

    <!-- Author Pill -->
    <g transform="translate(36, 368)">
      <rect x="0" y="0" width="260" height="40" fill="#f6eedb" stroke="#000000" stroke-width="3"/>
      <circle cx="20" cy="20" r="10" fill="#86efac" stroke="#000000" stroke-width="2"/>
      <text x="40" y="25" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">BY BITTU // BITTU.DEV</text>
    </g>
  </g>

  <!-- Right Visual: Isometric Minecraft Voxel + Hex stream -->
  <g transform="translate(730, 120)">
    <rect x="8" y="8" width="400" height="440" fill="#000000"/>
    <rect x="0" y="0" width="400" height="440" fill="#12151e" stroke="#000000" stroke-width="5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="400" height="40" fill="#1e2433" stroke="#000000" stroke-width="3"/>
    <text x="20" y="26" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#fde047">packet_dump.hex [STATE_PLAY]</text>

    <!-- Hex stream visual -->
    <g transform="translate(25, 60)" font-family="'Space Mono', monospace" font-size="13">
      <text x="0" y="20" fill="#8b949e">0000  <tspan fill="#fde047">0f 00 2f 09</tspan> <tspan fill="#86efac">6c 6f 63 61</tspan>  ../.loca</text>
      <text x="0" y="45" fill="#8b949e">0010  <tspan fill="#86efac">6c 68 6f 73</tspan> <tspan fill="#f87171">74 63 dd 01</tspan>  lhostc..</text>
      <text x="0" y="70" fill="#8b949e">0020  <tspan fill="#38bdf8">01 00 00 00</tspan> <tspan fill="#c4b5fd">00 00 00 00</tspan>  ........</text>
      <text x="0" y="95" fill="#8b949e">0030  <tspan fill="#86efac">78 9c 63 60</tspan> <tspan fill="#fde047">60 60 00 00</tspan>  x.c```..</text>
    </g>

    <!-- Isometric Grass Block Wireframe -->
    <g transform="translate(200, 270)">
      <!-- Top Face -->
      <polygon points="0,-60 70,-25 0,10 -70,-25" fill="#86efac" stroke="#000000" stroke-width="4"/>
      <!-- Left Face -->
      <polygon points="-70,-25 0,10 0,85 -70,50" fill="#78350f" stroke="#000000" stroke-width="4"/>
      <!-- Right Face -->
      <polygon points="0,10 70,-25 70,50 0,85" fill="#92400e" stroke="#000000" stroke-width="4"/>
      <!-- Grid Lines -->
      <line x1="-35" y1="-42" x2="35" y2="-7" stroke="#22c55e" stroke-width="2"/>
      <line x1="35" y1="-42" x2="-35" y2="-7" stroke="#22c55e" stroke-width="2"/>
    </g>

    <rect x="30" y="398" width="340" height="28" fill="#000000" stroke="#fde047" stroke-width="1"/>
    <text x="45" y="417" font-family="'Space Mono', monospace" font-size="12" fill="#fde047">&gt; PROTOCOL_VERSION: 765 [SYNC]</text>
  </g>
</svg>
