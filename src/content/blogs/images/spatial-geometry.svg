<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dot-grid-geo" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d3c6ab" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f6eedb"/>
  <rect width="1200" height="630" fill="url(#dot-grid-geo)"/>

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- Top Header Bar -->
  <rect x="24" y="24" width="1152" height="64" fill="#c4b5fd" stroke="#000000" stroke-width="6"/>
  <circle cx="64" cy="56" r="10" fill="#f87171" stroke="#000000" stroke-width="3"/>
  <circle cx="94" cy="56" r="10" fill="#fde047" stroke="#000000" stroke-width="3"/>
  <circle cx="124" cy="56" r="10" fill="#86efac" stroke="#000000" stroke-width="3"/>
  <text x="160" y="62" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#000000">ALGORITHMS // PYMUPDF_CARTESIAN_PARSER.PY</text>
  <rect x="990" y="40" width="160" height="32" fill="#000000"/>
  <text x="1006" y="62" font-family="'Space Mono', monospace" font-size="16" font-weight="bold" fill="#fde047">SPATIAL 2D</text>

  <!-- Main Content Card -->
  <g transform="translate(64, 120)">
    <rect x="8" y="8" width="620" height="440" fill="#000000"/>
    <rect x="0" y="0" width="620" height="440" fill="#fffdf9" stroke="#000000" stroke-width="5"/>
    
    <!-- Badges -->
    <rect x="36" y="36" width="120" height="32" fill="#38bdf8" stroke="#000000" stroke-width="3"/>
    <text x="50" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">PYTHON</text>

    <rect x="170" y="36" width="140" height="32" fill="#86efac" stroke="#000000" stroke-width="3"/>
    <text x="184" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">PyMuPDF 2D</text>

    <rect x="324" y="36" width="150" height="32" fill="#fde047" stroke="#000000" stroke-width="3"/>
    <text x="338" y="58" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">IIT KANPUR</text>

    <!-- Title -->
    <text x="36" y="126" font-family="'Space Grotesk', sans-serif" font-size="40" font-weight="900" fill="#000000">
      <tspan x="36" dy="0">Coordinate Geometry</tspan>
      <tspan x="36" dy="50">in PyMuPDF Parsing</tspan>
    </text>

    <text x="36" y="270" font-family="'Space Mono', monospace" font-size="18" fill="#444444">
      <tspan x="36" dy="0">Extracting unruly academic LaTeX PDFs</tspan>
      <tspan x="36" dy="28">using 2D Cartesian spatial coordinate</tspan>
      <tspan x="36" dy="28">clustering and step-gradient scoring.</tspan>
    </text>

    <!-- Author Pill -->
    <g transform="translate(36, 368)">
      <rect x="0" y="0" width="260" height="40" fill="#f6eedb" stroke="#000000" stroke-width="3"/>
      <circle cx="20" cy="20" r="10" fill="#c4b5fd" stroke="#000000" stroke-width="2"/>
      <text x="40" y="25" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#000000">BY BITTU // BITTU.DEV</text>
    </g>
  </g>

  <!-- Right Visual: Cartesian Document Coordinate Plot -->
  <g transform="translate(730, 120)">
    <rect x="8" y="8" width="400" height="440" fill="#000000"/>
    <rect x="0" y="0" width="400" height="440" fill="#12151e" stroke="#000000" stroke-width="5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="400" height="40" fill="#1e2433" stroke="#000000" stroke-width="3"/>
    <text x="20" y="26" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#38bdf8">bbox_clustering_plane.pdf</text>

    <!-- Cartesian Grid -->
    <g transform="translate(50, 70)">
      <!-- Axes -->
      <line x1="20" y1="20" x2="20" y2="300" stroke="#8b949e" stroke-width="2"/>
      <line x1="20" y1="300" x2="320" y2="300" stroke="#8b949e" stroke-width="2"/>
      
      <!-- Axis Labels -->
      <text x="5" y="25" font-family="'Space Mono', monospace" font-size="11" fill="#8b949e">Y</text>
      <text x="310" y="320" font-family="'Space Mono', monospace" font-size="11" fill="#8b949e">X</text>

      <!-- Simulated Bounding Boxes -->
      <!-- Header BBox -->
      <rect x="40" y="40" width="250" height="40" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="4,2"/>
      <text x="50" y="65" font-family="'Space Mono', monospace" font-size="11" fill="#fde047">BBox(42, 108, 595, 140)</text>

      <!-- Column 1 BBox -->
      <rect x="40" y="100" width="115" height="170" fill="none" stroke="#86efac" stroke-width="3"/>
      <text x="50" y="125" font-family="'Space Mono', monospace" font-size="11" fill="#86efac">COL_01</text>
      <line x1="45" y1="140" x2="145" y2="140" stroke="#86efac" stroke-width="1"/>
      <line x1="45" y1="160" x2="145" y2="160" stroke="#86efac" stroke-width="1"/>
      <line x1="45" y1="180" x2="130" y2="180" stroke="#86efac" stroke-width="1"/>

      <!-- Column 2 BBox -->
      <rect x="175" y="100" width="115" height="170" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <text x="185" y="125" font-family="'Space Mono', monospace" font-size="11" fill="#38bdf8">COL_02</text>
      <line x1="180" y1="140" x2="280" y2="140" stroke="#38bdf8" stroke-width="1"/>
      <line x1="180" y1="160" x2="280" y2="160" stroke="#38bdf8" stroke-width="1"/>
      <line x1="180" y1="180" x2="265" y2="180" stroke="#38bdf8" stroke-width="1"/>
    </g>

    <rect x="30" y="398" width="340" height="28" fill="#000000" stroke="#38bdf8" stroke-width="1"/>
    <text x="45" y="417" font-family="'Space Mono', monospace" font-size="12" fill="#38bdf8">&gt; CLUSTER_CONFIDENCE: 99.4% [OK]</text>
  </g>
</svg>
